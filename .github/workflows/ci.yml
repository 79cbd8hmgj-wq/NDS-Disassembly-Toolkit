name: CI

on:
  push:
    branches:
      - main
      - phase-1-low-level-core
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Test
        run: python -m pytest -v
      - name: Ruff
        run: python -m ruff check .
      - name: Mypy
        run: python -m mypy src/nds_disassembly_toolkit
