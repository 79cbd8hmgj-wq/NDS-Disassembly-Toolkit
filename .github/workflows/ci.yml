name: CI

on:
  push:
    branches:
      - main
      - phase-1-low-level-core
      - phase-2-workspace-roundtrip
      - phase-3-disassembly-analysis
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Test
        run: python -m pytest -v
      - name: Ruff
        run: python -m ruff check .
      - name: Mypy
        run: python -m mypy src/nds_disassembly_toolkit

  phase-7h-live-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install toolkit
        run: python -m pip install -e .
      - name: Build stock melonDS core
        shell: bash
        run: |
          set -euxo pipefail
          git clone --filter=blob:none https://github.com/melonDS-emu/melonDS.git /tmp/melonds
          git -C /tmp/melonds checkout 906e9ebb27da8c6a715cd7abab4abfe8a8d29427
          cmake -S /tmp/melonds -B /tmp/melonds/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_JIT=OFF \
            -DENABLE_GDBSTUB=ON \
            -DENABLE_OGLRENDERER=OFF \
            -DBUILD_QT_SDL=OFF
          cmake --build /tmp/melonds/build --target core -j2
      - name: Build live ARM9 target
        shell: bash
        run: |
          set -euxo pipefail
          SRC=/tmp/melonds/src
          BUILD=/tmp/melonds/build/src
          g++ -std=gnu++17 -O2 -DGDBSTUB_ENABLED -DARCHITECTURE_x86_64=1 -fwrapv \
            -I"$SRC" -I"$BUILD" -I"$SRC/teakra/include" \
            .github/smoke/headless_nds.cpp .github/smoke/headless_platform.cpp \
            "$BUILD/libcore.a" "$BUILD/teakra/src/libteakra.a" \
            -lm -lpthread -ldl -o /tmp/headless-nds
      - name: Exercise managed runtime session
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import time
          from pathlib import Path

          from nds_disassembly_toolkit.analysis.orchestration import (
              EmulatorKind,
              LaunchSpec,
              RuntimeLifecycleState,
          )
          from nds_disassembly_toolkit.analysis.orchestration.process import (
              create_session,
              process_is_owned,
              spawn_owned_process,
              stop_owned_process,
          )
          from nds_disassembly_toolkit.analysis.runtime import MelonDSSession, RuntimeCpu

          root = Path('/tmp/managed-runtime')
          rom = Path('/tmp/managed-fixture.nds')
          rom.write_bytes(b'NDS managed smoke')
          session = create_session(
              root,
              emulator=EmulatorKind.MELONDS,
              executable=Path('/tmp/headless-nds'),
              rom=rom,
              cpu=RuntimeCpu.ARM9,
          )
          running = spawn_owned_process(
              session,
              LaunchSpec(argv=('/tmp/headless-nds', str(session.debugger_port))),
          )
          assert running.lifecycle is RuntimeLifecycleState.LAUNCHING
          assert process_is_owned(running)
          assert running.debugger_port != 3333

          debugger = None
          last_error = None
          for _ in range(100):
              try:
                  debugger = MelonDSSession.connect(
                      cpu=RuntimeCpu.ARM9,
                      port=running.debugger_port,
                      timeout=1.0,
                  )
                  break
              except Exception as exc:
                  last_error = exc
                  time.sleep(0.05)
          if debugger is None:
              raise AssertionError(f'managed debugger never became ready: {last_error}')
          try:
              snapshot = debugger.snapshot()
              assert snapshot.pc == 0x02000000
          finally:
              debugger.close()

          closed = stop_owned_process(running, grace_seconds=1.0)
          assert closed.lifecycle is RuntimeLifecycleState.CLOSED
          assert not process_is_owned(closed)
          print('Phase 7H3A managed stock-melonDS session smoke passed')
          PY
      - name: Exercise exact runtime CLI
        shell: bash
        run: |
          set -euo pipefail
          PID=""
          start_target() {
            /tmp/headless-nds 3333 > /tmp/melonds-live.log 2>&1 &
            PID=$!
            sleep 1
            kill -0 "$PID"
          }
          stop_target() {
            if [ -n "${PID:-}" ]; then
              kill "$PID" 2>/dev/null || true
              wait "$PID" 2>/dev/null || true
              PID=""
            fi
          }
          trap stop_target EXIT

          # Phase 7H1 interoperability remains a release gate.
          start_target
          timeout 10s nds-toolkit runtime probe --cpu arm9 > /tmp/probe.json
          stop_target

          start_target
          timeout 10s nds-toolkit runtime snapshot --cpu arm9 > /tmp/snapshot.json
          stop_target

          start_target
          timeout 10s nds-toolkit runtime read-memory --cpu arm9 0x02000000 0x40 > /tmp/memory.json
          stop_target

          start_target
          timeout 10s nds-toolkit runtime run-until --cpu arm9 --break 0x02000008 > /tmp/run-until.json
          stop_target

          start_target
          timeout 10s nds-toolkit runtime step --cpu arm9 --count 1 > /tmp/step.json
          stop_target

          # Phase 7H2 bounded runtime traces, each from a clean target. Stock
          # melonDS break-on-startup consumes an initial debugger step without
          # executing ARM9 code, so eight bounded steps guarantee that the
          # deterministic writer reaches its STR instruction.
          start_target
          timeout 15s nds-toolkit runtime trace capture \
            --cpu arm9 \
            --steps 8 \
            --memory 0x02000100:4 \
            --output /tmp/step.ndstrace > /tmp/step-trace-summary.json
          stop_target

          start_target
          timeout 15s nds-toolkit runtime trace capture \
            --cpu arm9 \
            --break 0x02000008 \
            --events 2 \
            --output /tmp/break.ndstrace > /tmp/break-trace-summary.json
          stop_target

          # The pinned stock melonDS stub accepts Z2/Z3/Z4 packets but does not
          # call CheckWatchpt from CPU execution. Real watchpoint stops therefore
          # cannot be a stock-melonDS live gate. Toolkit watchpoint orchestration,
          # packet mapping, cleanup, and repeated CONTROL_ADVANCE behavior remain
          # covered by the Python verification suite.

          nds-toolkit runtime trace inspect /tmp/step.ndstrace > /tmp/inspect.json

          # Build a synthetic static project through public APIs for live differential correlation.
          python - <<'PY'
          from pathlib import Path
          from nds_disassembly_toolkit.analysis import Component, FunctionCandidate, InstructionSet
          from nds_disassembly_toolkit.analysis.project import AnalysisProject, ComponentAnalysisBundle

          base=0x02000000
          component=Component('arm9', Path('/tmp/live-arm9.bin'), base, bytes(0x200))
          functions=(
              FunctionCandidate(
                  component='arm9', address=base+0x08, offset=0x08,
                  instruction_set=InstructionSet.ARM,
                  confidence='high', evidence=('live-smoke',),
              ),
              FunctionCandidate(
                  component='arm9', address=base+0x0c, offset=0x0c,
                  instruction_set=InstructionSet.ARM,
                  confidence='high', evidence=('live-smoke',),
              ),
          )
          with AnalysisProject.create(Path('/tmp/live.ndsre')) as project:
              project.store_component_analysis(
                  ComponentAnalysisBundle(component=component, functions=functions)
              )
          PY

          start_target
          timeout 15s nds-toolkit runtime trace capture \
            --cpu arm9 \
            --break 0x0200000c \
            --events 2 \
            --project /tmp/live.ndsre \
            --output /tmp/baseline.ndstrace > /tmp/baseline-summary.json
          stop_target

          start_target
          timeout 15s nds-toolkit runtime trace capture \
            --cpu arm9 \
            --break 0x02000008 \
            --events 2 \
            --project /tmp/live.ndsre \
            --output /tmp/target.ndstrace > /tmp/target-summary.json
          stop_target

          nds-toolkit runtime diff \
            /tmp/baseline.ndstrace \
            /tmp/target.ndstrace \
            --project /tmp/live.ndsre > /tmp/diff.json

          python - <<'PY'
          import json
          from pathlib import Path
          from nds_disassembly_toolkit.analysis.runtime.trace_store import TraceStore
          from nds_disassembly_toolkit.analysis.runtime.trace_model import TraceEventRole

          load=lambda name: json.loads(Path(name).read_text())
          probe=load('/tmp/probe.json')
          snapshot=load('/tmp/snapshot.json')
          memory=load('/tmp/memory.json')
          run_until=load('/tmp/run-until.json')
          step=load('/tmp/step.json')
          step_summary=load('/tmp/step-trace-summary.json')
          break_summary=load('/tmp/break-trace-summary.json')
          inspect=load('/tmp/inspect.json')
          baseline_summary=load('/tmp/baseline-summary.json')
          target_summary=load('/tmp/target-summary.json')
          diff=load('/tmp/diff.json')

          # 7H1 behavior against the deterministic writer target.
          assert probe['cpu']=='arm9'
          assert snapshot['pc']=='0x02000000'
          assert snapshot['instruction_set']=='arm'
          assert memory['length']=='0x00000040'
          assert memory['data'].startswith(
              '0100a0e308109fe5010080e2000081e5fcffffea00010002'
          )
          assert run_until['condition']['address']=='0x02000008'
          assert run_until['snapshot']['pc']=='0x02000008'
          assert run_until['snapshot']['stop']['kind']=='breakpoint'
          regs={entry['name']:entry['value'] for entry in run_until['snapshot']['registers']}
          assert regs['r0']=='0x00000001'
          assert regs['r1']=='0x02000100'
          assert step['count']==1
          assert step['final_snapshot']['pc']=='0x02000000'
          assert step['final_snapshot']['stop']['kind']=='step'
          assert step['final_snapshot']['stop']['signal']==5
          regs={entry['name']:entry['value'] for entry in step['final_snapshot']['registers']}
          assert regs['r0']=='0x00000000'

          # 7H2 bounded step capture and real memory mutation.
          assert step_summary['capture_mode']=='step'
          assert step_summary['evidence_events']==8
          assert step_summary['control_events']==0
          assert step_summary['memory_regions']==1
          assert step_summary['terminated_by']=='limit'
          assert inspect['integrity_ok'] is True
          assert inspect['capture_status']=='complete'
          assert inspect['evidence_events']==8
          assert inspect['control_events']==0
          assert inspect['memory_changes']
          assert inspect['memory_changes'][0]['address']=='0x02000100'
          assert inspect['memory_changes'][0]['before'] != inspect['memory_changes'][0]['after']

          # Repeated breakpoint capture proves one explicit advance between evidence stops.
          assert break_summary['capture_mode']=='breakpoint'
          assert break_summary['evidence_events']==2
          assert break_summary['control_events']==1
          store=TraceStore.open(Path('/tmp/break.ndstrace'))
          try:
              events=store.events()
          finally:
              store.close()
          assert [event.role for event in events] == [
              TraceEventRole.EVIDENCE,
              TraceEventRole.CONTROL_ADVANCE,
              TraceEventRole.EVIDENCE,
          ]
          assert events[0].pc==0x02000008
          assert events[2].pc==0x02000008

          # Both project-bound traces carry the same exact static identity.
          assert baseline_summary['project_fingerprint']
          assert baseline_summary['project_fingerprint']==target_summary['project_fingerprint']
          assert diff['target_identity_verified'] is True
          address={(item['pc'], item['classification']):item for item in diff['address_deltas']}
          assert ('0x0200000c','baseline_only') in address
          assert ('0x02000008','target_only') in address
          functions={(item['address'], item['classification']):item for item in diff['function_deltas']}
          assert ('0x0200000c','baseline_only') in functions
          assert ('0x02000008','target_only') in functions
          assert diff['rankings'][0]['address']=='0x02000008'
          ranked={item['name']:item for item in diff['rankings'][0]['evidence']}
          assert ranked['target_exclusive']['value']==1.0
          assert ranked['condition_hit']['value']==1.0
          assert 'probability' not in json.dumps(diff, sort_keys=True).lower()

          print('Phase 7H1/7H2 live stock-melonDS smoke passed')
          PY


  phase-7h3-desmume-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install toolkit and DeSmuME build dependencies
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install -e .
          sudo apt-get update
          sudo apt-get install -y \
            meson ninja-build xvfb xdotool \
            libglib2.0-dev libsdl2-dev libpcap-dev zlib1g-dev \
            libx11-dev libgl1-mesa-dev
      - name: Build pinned DeSmuME CLI with GDB stub
        shell: bash
        run: |
          set -euxo pipefail
          git clone --filter=blob:none https://github.com/TASEmulators/desmume.git /tmp/desmume
          git -C /tmp/desmume checkout release_0_9_13
          meson setup /tmp/desmume/desmume/src/frontend/posix/build \
            /tmp/desmume/desmume/src/frontend/posix \
            --buildtype=release \
            -Dfrontend-gtk=false \
            -Dfrontend-cli=true \
            -Dgdb-stub=true
          ninja -C /tmp/desmume/desmume/src/frontend/posix/build
      - name: Build disposable minimal NDS ROM
        shell: bash
        run: |
          set -euxo pipefail
          python - <<'PY'
          import struct
          from pathlib import Path

          rom = bytearray(0x20000)
          rom[0x00:0x0C] = b'RSP SMOKE\0\0\0'
          rom[0x0C:0x10] = b'RSP0'
          rom[0x10:0x12] = b'00'
          rom[0x12] = 0
          rom[0x14] = 0
          arm9 = bytes.fromhex(
              '20009fe5'  # ldr r0, [pc, #32] -> sentinel address
              '20109fe5'  # ldr r1, [pc, #32] -> baseline value
              '001080e5'  # str r1, [r0]
              '1c209fe5'  # ldr r2, [pc, #28] -> KEYINPUT
              '1c409fe5'  # ldr r4, [pc, #28] -> dirty value
              'b030d2e1'  # ldrh r3, [r2]
              '010013e3'  # tst r3, #1 (A is active-low)
              'fcffff1a'  # bne poll
              '004080e5'  # str r4, [r0]
              'faffffea'  # b poll
              '00f03f02'  # 0x023ff000
              '44332211'  # 0x11223344
              '30010004'  # 0x04000130 KEYINPUT
              'ddccbbaa'  # 0xaabbccdd
          )
          struct.pack_into(
              '<IIII',
              rom,
              0x20,
              0x4000,
              0x02000000,
              0x02000000,
              len(arm9),
          )
          struct.pack_into('<IIII', rom, 0x30, 0x8000, 0x03800000, 0x03800000, 4)
          struct.pack_into('<II', rom, 0x40, 0, 0)
          struct.pack_into('<II', rom, 0x48, 0, 0)
          struct.pack_into('<I', rom, 0x80, len(rom))
          struct.pack_into('<I', rom, 0x84, 0x4000)
          rom[0x4000:0x4000 + len(arm9)] = arm9
          rom[0x8000:0x8004] = bytes.fromhex('feffffea')

          def crc16(data: bytes) -> int:
              value = 0xFFFF
              for byte in data:
                  value ^= byte
                  for _ in range(8):
                      value = (value >> 1) ^ (0xA001 if value & 1 else 0)
              return value & 0xFFFF

          struct.pack_into('<H', rom, 0x15C, crc16(bytes(rom[0xC0:0x15C])))
          struct.pack_into('<H', rom, 0x15E, crc16(bytes(rom[:0x15E])))
          Path('/tmp/rsp-smoke.nds').write_bytes(rom)
          PY
      - name: Verify DeSmuME direct-RSP dialect under Xvfb
        shell: bash
        run: |
          set -euxo pipefail
          PORT=39491
          GDBSTUB_DEBUG=1 xvfb-run -a \
            /tmp/desmume/desmume/src/frontend/posix/build/cli/desmume-cli \
            --arm9gdb "$PORT" --disable-sound --nojoy \
            /tmp/rsp-smoke.nds \
            >/tmp/desmume-smoke.out 2>/tmp/desmume-smoke.err &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true; wait "$PID" 2>/dev/null || true' EXIT
          sleep 1
          echo "---- listener diagnostics before attach ----"
          ss -ltnp || true
          cat /tmp/desmume-smoke.out || true
          cat /tmp/desmume-smoke.err || true
          set +e
          python - <<'PY'
          import time

          from nds_disassembly_toolkit.analysis.runtime import DeSmuMESession, RuntimeCpu

          session = None
          last_error = None
          for _ in range(100):
              try:
                  session = DeSmuMESession.connect(
                      cpu=RuntimeCpu.ARM9,
                      port=39491,
                      timeout=1.0,
                  )
                  break
              except Exception as exc:
                  last_error = exc
                  time.sleep(0.1)
          if session is None:
              raise AssertionError(f'DeSmuME GDB stub never became ready: {last_error}')
          try:
              snapshot = session.snapshot()
              assert snapshot.registers.value('pc') is not None
              assert snapshot.registers.value('cpsr') is not None
              assert session.capabilities is not None
          finally:
              session.close()
          print('Phase 7H3A DeSmuME direct-RSP smoke passed')
          PY
          STATUS=$?
          set -e
          if [ "$STATUS" -ne 0 ]; then
            echo "---- DeSmuME stdout ----"
            cat /tmp/desmume-smoke.out || true
            echo "---- DeSmuME stderr ----"
            cat /tmp/desmume-smoke.err || true
            echo "---- process state ----"
            ps -ef | grep -E '[d]esmume|[X]vfb' || true
            exit "$STATUS"
          fi

      - name: Verify managed DeSmuME window input through public CLI
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf /tmp/nds-managed-runtime
          mkdir -p /tmp/nds-managed-runtime
          export PATH="/tmp/desmume/desmume/src/frontend/posix/build/cli:$PATH"

          nds-toolkit runtime doctor \
            --emulator desmume \
            --rom /tmp/rsp-smoke.nds \
            --require managed_launch \
            --require window_input \
            --require touchscreen_input \
            --require save_state \
            --output /tmp/managed-doctor.json

          python - <<'PY'
          import json
          doctor = json.load(open('/tmp/managed-doctor.json'))
          assert doctor['passed'] is True
          required = {check['name']: check for check in doctor['checks']}
          for name in (
              'capability:managed_launch',
              'capability:window_input',
              'capability:touchscreen_input',
              'capability:save_state',
              'xvfb',
              'xdotool',
          ):
              assert required[name]['passed'] is True, required[name]
          PY

          nds-toolkit runtime launch /tmp/rsp-smoke.nds \
            --emulator desmume \
            --cpu arm9 \
            --session-root /tmp/nds-managed-runtime \
            --executable /tmp/desmume/desmume/src/frontend/posix/build/cli/desmume-cli \
            --output /tmp/managed-session.json

          SESSION_ROOT="$(python - <<'PY'
          import json
          print(json.load(open('/tmp/managed-session.json'))['session_root'])
          PY
          )"
          export SESSION_ROOT

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.load(open('/tmp/managed-session.json'))
          assert payload['display'].startswith(':')
          assert payload['window_id']
          root = Path(os.environ['SESSION_ROOT'])
          assert (root / 'display.json').is_file()
          PY

          python - <<'PY'
          import json

          from nds_disassembly_toolkit.analysis.runtime import DeSmuMESession, RuntimeCpu

          session_info = json.load(open('/tmp/managed-session.json'))
          session = DeSmuMESession.connect(
              cpu=RuntimeCpu.ARM9,
              host=session_info['debugger_host'],
              port=session_info['debugger_port'],
              timeout=2.0,
          )
          try:
              baseline_pc = session.snapshot().pc
          finally:
              session.close()
          json.dump({'pc': baseline_pc}, open('/tmp/managed-baseline-pc.json', 'w'))
          PY

          set +e
          nds-toolkit runtime checkpoint save "$SESSION_ROOT" baseline \
            --output /tmp/managed-checkpoint-save.json
          CHECKPOINT_STATUS=$?
          set -e
          if [ "$CHECKPOINT_STATUS" -ne 0 ]; then
            echo "---- managed session tree after checkpoint failure ----"
            find "$SESSION_ROOT" -maxdepth 5 -type f -print -exec ls -l {} \; || true
            echo "---- managed DeSmuME stdout ----"
            cat "$SESSION_ROOT/emulator.stdout.log" || true
            echo "---- managed DeSmuME stderr ----"
            cat "$SESSION_ROOT/emulator.stderr.log" || true
            exit "$CHECKPOINT_STATUS"
          fi

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          saved = json.load(open('/tmp/managed-checkpoint-save.json'))
          root = Path(os.environ['SESSION_ROOT'])
          assert saved['name'] == 'baseline'
          assert (root / 'checkpoints' / 'baseline' / 'checkpoint.json').is_file()
          assert (root / 'checkpoints' / 'baseline' / 'state.bin').is_file()
          PY

          python - <<'PY'
          import json

          from nds_disassembly_toolkit.analysis.runtime import (
              BreakpointKind,
              DeSmuMESession,
              RuntimeCpu,
          )

          session_info = json.load(open('/tmp/managed-session.json'))
          baseline_pc = json.load(open('/tmp/managed-baseline-pc.json'))['pc']
          session = DeSmuMESession.connect(
              cpu=RuntimeCpu.ARM9,
              host=session_info['debugger_host'],
              port=session_info['debugger_port'],
              timeout=2.0,
          )
          try:
              advanced_pc = session.step().pc
              assert advanced_pc != baseline_pc, (hex(baseline_pc), hex(advanced_pc))
              session.insert_breakpoint(BreakpointKind.CODE, baseline_pc)
          finally:
              session.close()
          PY

          nds-toolkit runtime checkpoint restore "$SESSION_ROOT" baseline \
            --output /tmp/managed-checkpoint-restore.json

          python - <<'PY'
          import json

          from nds_disassembly_toolkit.analysis.runtime import (
              BreakpointKind,
              DeSmuMESession,
              RuntimeCpu,
          )

          restored = json.load(open('/tmp/managed-checkpoint-restore.json'))
          assert restored['name'] == 'baseline'
          session_info = json.load(open('/tmp/managed-session.json'))
          baseline_pc = json.load(open('/tmp/managed-baseline-pc.json'))['pc']
          session = DeSmuMESession.connect(
              cpu=RuntimeCpu.ARM9,
              host=session_info['debugger_host'],
              port=session_info['debugger_port'],
              timeout=2.0,
          )
          try:
              assert session.snapshot().pc == baseline_pc
              session.remove_breakpoint(BreakpointKind.CODE, baseline_pc)
          finally:
              session.close()
          PY

          python - <<'PY'
          import json

          from nds_disassembly_toolkit.analysis.runtime import (
              BreakpointKind,
              DeSmuMESession,
              RuntimeCpu,
          )

          session_info = json.load(open('/tmp/managed-session.json'))
          baseline_pc = json.load(open('/tmp/managed-baseline-pc.json'))['pc']
          session = DeSmuMESession.connect(
              cpu=RuntimeCpu.ARM9,
              host=session_info['debugger_host'],
              port=session_info['debugger_port'],
              timeout=2.0,
          )
          try:
              dirty_pc = session.step().pc
              assert dirty_pc != baseline_pc
              session.insert_breakpoint(BreakpointKind.CODE, baseline_pc)
          finally:
              session.close()

          scenario = {
              'schema_version': 1,
              'name': 'managed-checkpoint-under-debugger',
              'backend': 'desmume',
              'cpu': 'arm9',
              'required_capabilities': ['save_state'],
              'checkpoint': 'baseline',
              'steps': [
                  {
                      'id': 'verify-debugger-restored-pc',
                      'type': 'assert',
                      'condition': {
                          'type': 'pc_equals',
                          'address': hex(baseline_pc),
                      },
                      'timeout': 2.0,
                  }
              ],
          }
          with open('/tmp/managed-checkpoint-scenario.json', 'w') as handle:
              json.dump(scenario, handle)
          PY

          nds-toolkit runtime scenario run \
            "$SESSION_ROOT" /tmp/managed-checkpoint-scenario.json \
            --output /tmp/managed-checkpoint-scenario-result.json

          python - <<'PY'
          import json

          from nds_disassembly_toolkit.analysis.runtime import (
              BreakpointKind,
              DeSmuMESession,
              RuntimeCpu,
          )

          restored = json.load(open('/tmp/managed-checkpoint-scenario-result.json'))
          assert restored['status'] == 'passed'
          assert restored['completed_steps'] == ['verify-debugger-restored-pc']

          session_info = json.load(open('/tmp/managed-session.json'))
          baseline_pc = json.load(open('/tmp/managed-baseline-pc.json'))['pc']
          session = DeSmuMESession.connect(
              cpu=RuntimeCpu.ARM9,
              host=session_info['debugger_host'],
              port=session_info['debugger_port'],
              timeout=2.0,
          )
          try:
              session.remove_breakpoint(BreakpointKind.CODE, baseline_pc)
          finally:
              session.close()
          PY

          cat >/tmp/managed-input-scenario.json <<'JSON'
          {
            "schema_version": 1,
            "name": "managed-input-smoke",
            "backend": "desmume",
            "cpu": "arm9",
            "required_capabilities": ["touchscreen_input"],
            "steps": [
              {"id": "touch-center", "type": "touch_tap", "point": [128, 96]}
            ]
          }
          JSON

          nds-toolkit runtime scenario run \
            "$SESSION_ROOT" /tmp/managed-input-scenario.json \
            --output /tmp/managed-input-result.json

          python - <<'PY'
          import json
          result = json.load(open('/tmp/managed-input-result.json'))
          assert result['status'] == 'passed'
          assert result['completed_steps'] == ['touch-center']
          PY

          nds-toolkit runtime session stop "$SESSION_ROOT" \
            --output /tmp/managed-stopped.json

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          stopped = json.load(open('/tmp/managed-stopped.json'))
          assert stopped['lifecycle'] == 'closed'
          assert not (Path(os.environ['SESSION_ROOT']) / 'display.json').exists()
          PY
